spring.application.name=budgeting
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# DataSource H2 in-memory para testes herméticos
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.docker.compose.enabled=false

# Ollama LLM
spring.ai.openai.base-url=${AI_BASE_URL:http://localhost:11434}
spring.ai.openai.api-key=${OPENAI_API_KEY:ollama}
spring.ai.openai.chat.options.model=${AI_MODEL:hermes3:8b}
app.ai.models=hermes3:8b,qwen2.5:14b
spring.ai.openai.chat.options.response-format.type=TEXT

# Speaches STT (Faster-Whisper)
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.base-url=${STT_BASE_URL:http://localhost:8002}
spring.ai.openai.audio.transcription.options.model=${STT_MODEL:Systran/faster-whisper-small}
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro.

# Speaches TTS (Kokoro)
spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.base-url=${TTS_BASE_URL:http://localhost:8002}
spring.ai.openai.audio.speech.options.model=${TTS_MODEL:speaches-ai/Kokoro-82M-v1.0-ONNX}
spring.ai.openai.audio.speech.options.voice=${TTS_VOICE:pf_dora}
spring.ai.openai.audio.speech.options.speed=1.2
spring.ai.openai.audio.speech.options.response-format=mp3
